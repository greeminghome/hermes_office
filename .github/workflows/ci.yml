name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: docker compose --env-file .env.example -f docker-compose.office.yml config --quiet
      - run: docker build --tag hermes-office:ci .
      - run: docker build --check --file deploy/hermes-agent/Dockerfile deploy/hermes-agent
